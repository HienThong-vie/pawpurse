name: Keep demo alive

# Both free tiers go to sleep: Render sleeps the API after ~15 min idle and Supabase pauses
# idle projects after about a week. Delete this workflow when moving to paid hosting.
on:
  schedule:
    - cron: "*/10 * * * *"   # wake / keep the API warm
    - cron: "17 */6 * * *"   # end-to-end: sign in + read through the API (touches Supabase + Postgres)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      DEMO_EMAIL: demo@pawpurse.app
      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
    steps:
      - name: Ping API
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 120 "$BACKEND_URL/"

      - name: Sign in and read through the API
        if: github.event.schedule != '*/10 * * * *'
        run: |
          token=$(jq -n --arg e "$DEMO_EMAIL" --arg p "$DEMO_PASSWORD" '{email:$e,password:$p}' \
            | curl -fsS --max-time 60 -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
                -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d @- \
            | jq -r .access_token)
          curl -fsS --max-time 120 "$BACKEND_URL/settings/" -H "Authorization: Bearer $token" > /dev/null
