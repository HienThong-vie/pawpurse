# Render Blueprint: one-click deploy of the API + Postgres.
# Dashboard -> New -> Blueprint -> select this repo. Render prompts for the
# variables marked `sync: false`; the frontend lives on Vercel.
services:
  - type: web
    name: pawpurse-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: pawpurse-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://pawpurse.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EXCHANGE_RATE_API_KEY
        sync: false
      - key: DEMO_USER_ID
        sync: false

databases:
  - name: pawpurse-db
    plan: free
